<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>抽獎記錄 (手機直式｜日期往前至週日)</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        max-width: 100%;
        margin: 0;
        padding: 14px;
        background: #fefefe;
    }
    h1 {
        font-size: 1.6rem;
        margin: 0 0 12px 0;
        word-break: break-word;
    }
    .warning-note {
        background-color: #fff0b3;
        border-left: 5px solid #ffc107;
        padding: 10px 12px;
        margin-bottom: 16px;
        font-size: 0.85rem;
        border-radius: 12px;
        line-height: 1.4;
    }
    .input-group {
        margin: 12px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #f8f9fa;
        padding: 12px;
        border-radius: 16px;
    }
    .input-group label {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        width: 100%;
    }
    .input-group select, 
    .input-group input, 
    .input-group button {
        font-size: 0.9rem;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #ccc;
        background: white;
        flex: 1;
        min-width: 120px;
    }
    button {
        background: #e9ecef;
        border: none;
        font-weight: 500;
        touch-action: manipulation;
    }
    button:active {
        background: #d4d4d4;
        transform: scale(0.97);
    }
    /* 表格區域：無橫向滾動，強制內容換行 */
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        table-layout: auto;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px 4px;
        text-align: center;
        word-break: break-word;
        white-space: normal;
    }
    th {
        background-color: #f2f2f2;
        font-weight: 600;
        font-size: 0.8rem;
    }
    /* 金額及狀態樣式 */
    .amount-very-low { background-color: #d4edda; }
    .amount-low { background-color: #fff3cd; }
    .amount-medium { background-color: #b3e5fc; }
    .amount-high { background-color: #f3e5f5; }
    .amount-very-high { background-color: #f8d7da; }
    .used-yes { background-color: #d4edda; cursor: pointer; }
    .used-no { background-color: #ffffff; cursor: pointer; }
    .summary {
        margin-top: 20px;
        padding: 12px;
        border-radius: 16px;
        background: #f9f9f9;
        font-size: 0.85rem;
        word-break: break-word;
    }
    .summary h3 {
        margin-top: 0;
        font-size: 1.1rem;
    }
    .summary ul {
        padding-left: 20px;
        margin: 8px 0;
    }
    .date-rule-hint {
        background-color: #e2f0e6;
        padding: 5px 10px;
        border-radius: 30px;
        font-size: 0.7rem;
        color: #2c6e2c;
        display: inline-block;
        white-space: nowrap;
    }
    .toast-msg {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #323232e0;
        color: white;
        padding: 6px 16px;
        border-radius: 40px;
        font-size: 0.8rem;
        z-index: 1000;
        backdrop-filter: blur(4px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        text-align: center;
        max-width: 85vw;
        white-space: normal;
    }
    /* 手機專屬：讓表格完全自適應，不滾動 */
    @media (max-width: 640px) {
        body {
            padding: 10px;
        }
        th, td {
            font-size: 0.7rem;
            padding: 6px 2px;
        }
        .input-group {
            flex-direction: column;
            align-items: stretch;
        }
        .input-group label {
            width: 100%;
            justify-content: space-between;
        }
        .input-group select, .input-group input, .input-group button {
            width: 100%;
        }
        button {
            margin-top: 4px;
        }
        .date-rule-hint {
            font-size: 0.65rem;
            text-align: center;
        }
    }
</style>
</head>
<body>
    <h1>🎲 抽獎金額記錄</h1>
    <div class="warning-note">
        📌 <strong>抽獎日必須是 星期五、六、日</strong><br>
        🔄 若今天不是五六日，日期自動「往前調到上一個星期日」<br>
        📅 使用期限：下週一 ~ 下週四 &nbsp;|&nbsp; 週五自動清空歸檔<br>
        ✅ 新增記錄無彈窗，輕提示確認
    </div>

    <div class="input-group">
        <label>➕ 新使用者: 
            <input type="text" id="newUser" placeholder="名稱">
            <button onclick="addUser()">新增</button>
        </label>
    </div>

    <div class="input-group">
        <label>👤 用戶: <select id="user"></select></label>
        <label>🏦 銀行: 
            <select id="bank">
                <option>中銀</option><option>大豐</option><option>工商</option>
                <option>MPAY</option><option>支付寶</option><option>UEPAY</option>
                <option>國際</option><option>廣發</option>
            </select>
        </label>
        <label>💰 金額: 
            <select id="amount">
                <option>10</option><option>20</option><option>50</option>
                <option>100</option><option>200</option>
            </select>
        </label>
        <label>📅 抽獎日 (五六日): 
            <input type="date" id="drawDate">
        </label>
        <span class="date-rule-hint">⚠️ 限五六日</span>
        <button onclick="addRecord()">📝 新增記錄</button>
    </div>

    <div class="input-group">
        <label>🗑️ 刪除使用者: <select id="deleteUserSelect"></select>
        <button onclick="deleteUser()">刪除</button></label>
        <button onclick="exportData()">📤 匯出</button>
        <label>📂 匯入: <input type="file" id="importFile" accept=".json" onchange="importData()"></label>
    </div>

    <!-- 無橫向捲軸容器，直接放表格 -->
    <div style="overflow-x: visible;">
        <table id="dataTable">
            <thead>
                <tr><th onclick="sortTable('user')">用戶</th><th onclick="sortTable('bank')">銀行</th>
                <th onclick="sortTable('amount')">金額</th><th>抽獎日</th><th>使用期限</th><th>已使用</th><th>操作</th></tr>
            </thead>
            <tbody id="recordsTable"></tbody>
        </table>
    </div>

    <div id="bankSummary"></div>
    <div id="weeklySummary"></div>
    <div id="cumulativeWeeklySummary"></div>
    <div id="toastMsg" class="toast-msg"></div>

    <script>
        // ---------- 全域 ----------
        let users = JSON.parse(localStorage.getItem('users')) || ['test'];
        let records = JSON.parse(localStorage.getItem('drawRecords')) || [];
        let historicalWeeklySummary = JSON.parse(localStorage.getItem('historicalWeeklySummary')) || {};
        let sortDirection = { user: 1, bank: 1, amount: 1 };

        function showToast(msg, isErr = false) {
            const t = document.getElementById('toastMsg');
            if (!t) return;
            t.style.backgroundColor = isErr ? '#c0392be0' : '#2c6e2ce0';
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 1800);
        }

        // 檢查日期是否為五六日
        function isValidDrawDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return false;
            const day = d.getDay();
            return (day === 5 || day === 6 || day === 0);
        }

        function getTodayYMD() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 新邏輯：取得上一個星期日 (若今天就是星期日則回傳今天)
        function getPreviousSunday() {
            const today = new Date();
            const day = today.getDay(); // 0星期日 ~ 6星期六
            if (day === 0) return getTodayYMD();
            // 往前推 day 天 (例如星期一往前1天到星期日，星期二往前2天...)
            const prevSunday = new Date(today);
            prevSunday.setDate(today.getDate() - day);
            return `${prevSunday.getFullYear()}-${String(prevSunday.getMonth()+1).padStart(2,'0')}-${String(prevSunday.getDate()).padStart(2,'0')}`;
        }

        // 取得「有效的預設抽獎日」: 若今天為五六日則用今天，否則用上一個星期日
        function getNearestValidDrawDate() {
            const today = new Date();
            const dow = today.getDay();
            if (dow === 5 || dow === 6 || dow === 0) {
                return getTodayYMD();
            } else {
                return getPreviousSunday();
            }
        }

        // 重置日期picker
        function resetDatePicker() {
            const inp = document.getElementById('drawDate');
            if (inp) inp.value = getNearestValidDrawDate();
        }

        function getCurrentDrawDate() {
            const inp = document.getElementById('drawDate');
            let val = inp ? inp.value : '';
            if (!val) val = getNearestValidDrawDate();
            return val;
        }

        // 下週一到四區間
        function getMondayToThursdayRange(drawDateStr) {
            const draw = new Date(drawDateStr);
            if (isNaN(draw.getTime())) return "無效日期";
            const dow = draw.getDay();
            let add = 0;
            if (dow === 5) add = 3;      // 週五 -> 下週一 +3
            else if (dow === 6) add = 2; // 週六 -> +2
            else if (dow === 0) add = 1; // 週日 -> +1
            else add = (8 - dow) % 7 || 7;
            const mon = new Date(draw);
            mon.setDate(draw.getDate() + add);
            const thu = new Date(mon);
            thu.setDate(mon.getDate() + 3);
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return `${fmt(mon)} ~ ${fmt(thu)}`;
        }

        function saveData() {
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('drawRecords', JSON.stringify(records));
            localStorage.setItem('historicalWeeklySummary', JSON.stringify(historicalWeeklySummary));
        }

        function updateUserSelect() {
            const sel = document.getElementById('user');
            const delSel = document.getElementById('deleteUserSelect');
            sel.innerHTML = ''; delSel.innerHTML = '';
            users.forEach(u => {
                let opt = new Option(u, u);
                sel.appendChild(opt);
                delSel.appendChild(opt.cloneNode(true));
            });
        }

        function addUser() {
            let name = document.getElementById('newUser').value.trim();
            if (name && !users.includes(name)) {
                users.push(name);
                saveData();
                updateUserSelect();
                document.getElementById('newUser').value = '';
                showToast(`✅ 新增使用者 ${name}`);
            } else if (!name) showToast('請輸入名稱', true);
            else showToast('名稱已存在', true);
        }

        function deleteUser() {
            let target = document.getElementById('deleteUserSelect').value;
            if (confirm(`確定刪除 ${target} 及所有記錄嗎？`)) {
                users = users.filter(u => u !== target);
                records = records.filter(r => r.user !== target);
                for (let w in historicalWeeklySummary) {
                    delete historicalWeeklySummary[w][target];
                    if (Object.keys(historicalWeeklySummary[w]).length === 0) delete historicalWeeklySummary[w];
                }
                saveData();
                updateUserSelect();
                displayRecords();
                showToast(`已刪除 ${target}`);
            }
        }

        function getWeekNumber(date) {
            let d = new Date(date);
            d.setHours(0,0,0,0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            let yearStart = new Date(d.getFullYear(), 0, 4);
            return Math.round(((d - yearStart) / 86400000 + 1) / 7);
        }

        function updateHistorical(record, isToggle = false) {
            let week = `${new Date(record.drawDate).getFullYear()}-W${getWeekNumber(record.drawDate)}`;
            if (!historicalWeeklySummary[week]) historicalWeeklySummary[week] = {};
            if (!historicalWeeklySummary[week][record.user]) 
                historicalWeeklySummary[week][record.user] = { total:0, count:0, used:0, unused:0 };
            let uw = historicalWeeklySummary[week][record.user];
            if (isToggle) {
                if (record.used) { uw.used += record.amount; uw.unused -= record.amount; }
                else { uw.used -= record.amount; uw.unused += record.amount; }
            } else {
                uw.total += record.amount;
                uw.count += 1;
                uw.unused += record.amount;
            }
        }

        function addRecordInternal(user, bank, amount, drawDateStr) {
            let expiry = getMondayToThursdayRange(drawDateStr);
            let newRecord = {
                id: Date.now(), user, bank, amount, drawDate: drawDateStr, expiry, used: false
            };
            records.push(newRecord);
            updateHistorical(newRecord, false);
            saveData();
            displayRecords();
            showToast(`✅ 新增 ${user} | ${bank} ${amount}元 | ${drawDateStr}`);
        }

        function addRecord() {
            let user = document.getElementById('user').value;
            let bank = document.getElementById('bank').value;
            let amount = parseFloat(document.getElementById('amount').value);
            if (!amount || isNaN(amount)) { showToast('請選擇金額', true); return; }
            let drawDate = getCurrentDrawDate();
            if (!isValidDrawDate(drawDate)) {
                showToast(`❌ 抽獎日必須是五六日！您選了 ${drawDate}`, true);
                resetDatePicker();
                return;
            }
            addRecordInternal(user, bank, amount, drawDate);
        }

        function deleteRecord(id) {
            let rec = records.find(r => r.id === id);
            if (!rec) return;
            let week = `${new Date(rec.drawDate).getFullYear()}-W${getWeekNumber(rec.drawDate)}`;
            if (historicalWeeklySummary[week] && historicalWeeklySummary[week][rec.user]) {
                let uw = historicalWeeklySummary[week][rec.user];
                uw.total -= rec.amount;
                uw.count -= 1;
                uw.used -= rec.used ? rec.amount : 0;
                uw.unused -= rec.used ? 0 : rec.amount;
                if (uw.count === 0) {
                    delete historicalWeeklySummary[week][rec.user];
                    if (Object.keys(historicalWeeklySummary[week]).length === 0) delete historicalWeeklySummary[week];
                }
            }
            records = records.filter(r => r.id !== id);
            saveData();
            displayRecords();
            showToast(`🗑️ 已刪除 ${rec.user} ${rec.amount}元`);
        }

        function toggleUsed(id) {
            let rec = records.find(r => r.id === id);
            if (rec) {
                rec.used = !rec.used;
                updateHistorical(rec, true);
                saveData();
                displayRecords();
                showToast(`${rec.used ? '✅ 已使用' : '🔄 未使用'} ${rec.amount}元`);
            }
        }

        function getAmountClass(amt) {
            if (amt == 10) return 'amount-very-low';
            if (amt == 20) return 'amount-low';
            if (amt == 50) return 'amount-medium';
            if (amt == 100) return 'amount-high';
            if (amt == 200) return 'amount-very-high';
            return '';
        }

        // 排序與顯示共用
        function sortTable(key) {
            let curUser = document.getElementById('user').value;
            let filtered = records.filter(r => r.user === curUser);
            filtered.sort((a,b) => {
                let va = a[key], vb = b[key];
                if (key === 'amount') return (va - vb) * sortDirection[key];
                else return va.localeCompare(vb) * sortDirection[key];
            });
            sortDirection[key] = -sortDirection[key];
            renderTableBody(filtered);
        }

        function renderTableBody(dataArray) {
            let tbody = document.getElementById('recordsTable');
            tbody.innerHTML = '';
            dataArray.forEach(rec => {
                let row = tbody.insertRow();
                row.insertCell(0).innerText = rec.user;
                row.insertCell(1).innerText = rec.bank;
                let amtCell = row.insertCell(2);
                amtCell.innerText = rec.amount;
                amtCell.className = getAmountClass(rec.amount);
                row.insertCell(3).innerText = rec.drawDate;
                row.insertCell(4).innerText = rec.expiry;
                let usedCell = row.insertCell(5);
                usedCell.innerText = rec.used ? '是' : '否';
                usedCell.className = rec.used ? 'used-yes' : 'used-no';
                usedCell.onclick = () => toggleUsed(rec.id);
                let delCell = row.insertCell(6);
                let btn = document.createElement('button');
                btn.innerText = '刪除';
                btn.style.fontSize = '0.7rem';
                btn.style.padding = '4px 8px';
                btn.onclick = () => deleteRecord(rec.id);
                delCell.appendChild(btn);
            });
        }

        function displayRecords() {
            let curUser = document.getElementById('user').value;
            let filtered = records.filter(r => r.user === curUser);
            renderTableBody(filtered);
            displaySummaries();
        }

        function displaySummaries() {
            let user = document.getElementById('user').value;
            let userRecords = records.filter(r => r.user === user);
            // 銀行小結
            let bankMap = {};
            userRecords.forEach(r => {
                if (!bankMap[r.bank]) bankMap[r.bank] = { total:0, count:0, used:0, unused:0 };
                bankMap[r.bank].total += r.amount;
                bankMap[r.bank].count++;
                if (r.used) bankMap[r.bank].used += r.amount;
                else bankMap[r.bank].unused += r.amount;
            });
            let bankHtml = '<div class="summary"><h3>🏦 銀行小結</h3><ul>';
            for (let b in bankMap) {
                bankHtml += `<li>${b}: 總額 ${bankMap[b].total} (${bankMap[b].count}筆) 已用 ${bankMap[b].used} 未用 ${bankMap[b].unused}</li>`;
            }
            bankHtml += '</ul></div>';
            document.getElementById('bankSummary').innerHTML = bankHtml;

            // 每週總結 (根據抽獎日)
            let weekly = {};
            userRecords.forEach(r => {
                let week = `${new Date(r.drawDate).getFullYear()}-W${getWeekNumber(r.drawDate)}`;
                if (!weekly[week]) weekly[week] = { total:0, count:0, used:0, unused:0 };
                weekly[week].total += r.amount;
                weekly[week].count++;
                if (r.used) weekly[week].used += r.amount;
                else weekly[week].unused += r.amount;
            });
            let weeklyHtml = '<div class="summary"><h3>📅 每週抽獎總結 (抽獎週)</h3><ul>';
            for (let w in weekly) {
                weeklyHtml += `<li>${w}: 總額 ${weekly[w].total} (${weekly[w].count}筆) 已用 ${weekly[w].used} 未用 ${weekly[w].unused}</li>`;
            }
            weeklyHtml += '</ul></div>';
            document.getElementById('weeklySummary').innerHTML = weeklyHtml;

            // 歷史週統計
            let histHtml = '<div class="summary"><h3>📚 歷史每週統計 (永久)</h3><ul>';
            for (let w in historicalWeeklySummary) {
                if (historicalWeeklySummary[w][user]) {
                    let s = historicalWeeklySummary[w][user];
                    histHtml += `<li>${w}: 總額 ${s.total} (${s.count}筆) 已用 ${s.used} 未用 ${s.unused}</li>`;
                }
            }
            histHtml += '</ul></div>';
            let cumTotal = 0, cumCount = 0, cumUsed = 0, cumUnused = 0;
            for (let w in historicalWeeklySummary) {
                if (historicalWeeklySummary[w][user]) {
                    cumTotal += historicalWeeklySummary[w][user].total;
                    cumCount += historicalWeeklySummary[w][user].count;
                    cumUsed += historicalWeeklySummary[w][user].used;
                    cumUnused += historicalWeeklySummary[w][user].unused;
                }
            }
            let cumHtml = `<div class="summary"><h3>📊 累計總結</h3><p>總金額 ${cumTotal} | 總筆數 ${cumCount} | 已使用 ${cumUsed} | 未使用 ${cumUnused}</p></div>`;
            document.getElementById('cumulativeWeeklySummary').innerHTML = histHtml + cumHtml;
        }

        function checkFridayReset() {
            let today = new Date();
            if (today.getDay() === 5) {
                let last = localStorage.getItem('lastFridayReset');
                let todayStr = today.toDateString();
                if (last !== todayStr) {
                    if (records.length > 0) {
                        records = [];
                        saveData();
                        displayRecords();
                        showToast('🧹 週五重置: 本週記錄已清空，歷史保留');
                    }
                    localStorage.setItem('lastFridayReset', todayStr);
                }
            }
        }

        function exportData() {
            let data = { users, records, historicalWeeklySummary, version: 'mobile_no_scroll_prev_sunday' };
            let blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'draw_records.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('📁 匯出成功');
        }

        function importData() {
            let file = document.getElementById('importFile').files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = e => {
                try {
                    let data = JSON.parse(e.target.result);
                    let impUsers = data.users || [];
                    let impRecords = data.records || [];
                    let impHist = data.historicalWeeklySummary || {};
                    impUsers.forEach(u => { if (!users.includes(u)) users.push(u); });
                    impRecords.forEach(r => {
                        if (!records.some(ex => ex.id === r.id) && isValidDrawDate(r.drawDate)) {
                            r.expiry = getMondayToThursdayRange(r.drawDate);
                            records.push(r);
                            updateHistorical(r, false);
                        }
                    });
                    for (let w in impHist) {
                        if (!historicalWeeklySummary[w]) historicalWeeklySummary[w] = {};
                        for (let u in impHist[w]) {
                            if (!historicalWeeklySummary[w][u]) historicalWeeklySummary[w][u] = impHist[w][u];
                            else {
                                historicalWeeklySummary[w][u].total += impHist[w][u].total;
                                historicalWeeklySummary[w][u].count += impHist[w][u].count;
                                historicalWeeklySummary[w][u].used += impHist[w][u].used;
                                historicalWeeklySummary[w][u].unused += impHist[w][u].unused;
                            }
                        }
                    }
                    saveData();
                    updateUserSelect();
                    displayRecords();
                    showToast('✅ 匯入完成 (僅合併符合五六日之記錄)');
                } catch(err) { showToast('匯入失敗，格式錯誤', true); }
            };
            reader.readAsText(file);
        }

        function migrateExpiry() {
            let changed = false;
            records.forEach(r => {
                let newExp = getMondayToThursdayRange(r.drawDate);
                if (r.expiry !== newExp) { r.expiry = newExp; changed = true; }
            });
            if (changed) saveData();
        }

        function init() {
            updateUserSelect();
            migrateExpiry();
            resetDatePicker();      // 設定日期為「上個星期日或今日五六日」
            checkFridayReset();
            displayRecords();
            document.getElementById('user').addEventListener('change', displayRecords);
            setInterval(() => checkFridayReset(), 3600000);
        }
        init();
    </script>
</body>
</html>
